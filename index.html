<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Turnos - Pilates</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #1e1e24;
            --panel-bg: #141419;
            --grid-border: #3a3a43;
            --cell-bg: #2a2a35;
            --text-color: #ffffff;
            --primary: #34495e;
            --accent: #27ae60;
            --danger: #c0392b;
            --warning: #f39c12;
            --feriado-bg: #251d24;
            --feriado-border: #8e44ad;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .login-card {
            background: var(--panel-bg);
            border: 1px solid var(--grid-border);
            padding: 25px;
            border-radius: 12px;
            width: 360px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .login-card h2 { margin-top: 0; text-align: center; color: #3498db; }

        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 0.8rem; margin-bottom: 4px; color: #aaa; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 8px 10px;
            background: var(--cell-bg);
            border: 1px solid var(--grid-border);
            color: #fff;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .btn {
            background-color: var(--primary);
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .btn:hover { opacity: 0.9; }
        .btn-block { width: 100%; }
        .btn-action { background-color: var(--accent); }
        .btn-danger { background-color: var(--danger); }
        .btn-warning { background-color: var(--warning); color: #1e1e24; }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--panel-bg);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--grid-border);
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .user-info { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; flex-wrap: wrap; }
        .badge-status { background: #27ae60; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
        .badge-status.inactive { background: #c0392b; }
        .badge-creditos { background: var(--warning); padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; color: #1e1e24; }
        .badge-info { background: #2980b9; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }

        .nota-semanal-container {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            max-width: 320px;
        }

        .nota-semanal-input {
            width: 100%;
            background: var(--cell-bg);
            border: 1px solid var(--grid-border);
            color: #f1c40f;
            font-size: 0.8rem;
            padding: 6px 10px;
            border-radius: 6px;
            resize: none;
            height: 36px;
        }

        .main-container { display: flex; gap: 15px; flex: 1; overflow: hidden; }

        .sidebar {
            width: 340px;
            background: var(--panel-bg);
            border: 1px solid var(--grid-border);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
        }

        .pizarra-container {
            flex: 1;
            background: var(--panel-bg);
            border: 1px solid var(--grid-border);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            overflow-x: auto;
        }

        .grid-header {
            display: grid;
            grid-template-columns: 75px repeat(6, minmax(110px, 1fr));
            border-bottom: 2px solid var(--grid-border);
            padding-bottom: 5px;
            font-weight: bold;
            font-size: 0.8rem;
            text-align: center;
        }

        .header-day {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2px;
        }

        .btn-feriado-toggle {
            font-size: 0.65rem;
            background: transparent;
            border: 1px solid var(--grid-border);
            color: #aaa;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 3px;
            padding: 2px 4px;
        }

        .btn-feriado-toggle.active {
            background: var(--feriado-border);
            color: #fff;
            border-color: var(--feriado-border);
        }

        .grid-body { display: flex; flex-direction: column; overflow-y: auto; flex: 1; }

        .grid-row {
            display: grid;
            grid-template-columns: 75px repeat(6, minmax(110px, 1fr));
            border-bottom: 1px solid var(--grid-border);
            min-height: 52px;
        }

        .time-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: bold;
            color: #8a8a93;
            border-right: 1px solid var(--grid-border);
            background: #101014;
        }

        .slot-cell {
            background-color: var(--cell-bg);
            border-right: 1px solid var(--grid-border);
            padding: 4px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            position: relative;
        }

        .slot-cell.feriado-col {
            background-color: var(--feriado-bg) !important;
            opacity: 0.6;
        }

        .slot-info { font-size: 0.7rem; color: #8a8a93; text-align: center; font-weight: bold; margin-top: 2px; }

        .ficha {
            background-color: #34495e;
            color: #fff;
            padding: 4px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #2980b9;
        }

        .ficha.propia {
            background-color: #27ae60;
            border-left-color: #2ecc71;
            cursor: pointer;
            font-weight: bold;
        }

        .disabled-slot { background-color: #1a1a20; opacity: 0.4; cursor: not-allowed; }
        .hidden { display: none !important; }

        .slot-reserva-btn {
            background: #2ecc71;
            color: #1e1e24;
            font-weight: bold;
            font-size: 0.65rem;
            border: none;
            padding: 4px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 2px;
            text-align: center;
        }

        .slot-admin-recupero-btn {
            background: #f39c12;
            color: #1e1e24;
            font-weight: bold;
            font-size: 0.65rem;
            border: none;
            padding: 3px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 2px;
            text-align: center;
        }

        .alumno-card {
            background: #1c1c24;
            border: 1px solid var(--grid-border);
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 0.75rem;
        }

        .alumno-actions {
            display: flex;
            gap: 4px;
            margin-top: 6px;
            align-items: center;
        }
    </style>
</head>
<body>

    <!-- MODAL DE LOGIN -->
    <div id="login-modal" class="login-overlay">
        <div class="login-card">
            <h2>Acceso Pilates</h2>
            <form id="login-form">
                <div class="form-group">
                    <label>Nombre y Apellido / Usuario</label>
                    <input type="text" id="login-user" placeholder="Ej: Juan Perez o admin" required>
                </div>
                <div class="form-group">
                    <label>Contraseña / Clave</label>
                    <input type="password" id="login-pass" placeholder="Ingresa tu clave" required>
                </div>
                <button type="submit" class="btn btn-action btn-block">Ingresar</button>
            </form>
        </div>
    </div>

    <!-- MODAL TARIFAS -->
    <div id="tarifas-modal" class="login-overlay hidden">
        <div class="login-card">
            <h2>Configurar Tarifas</h2>
            <form id="tarifas-form">
                <div class="form-group"><label>1 Clase/sem ($)</label><input type="number" id="tarifa-1" required></div>
                <div class="form-group"><label>2 Clases/sem ($)</label><input type="number" id="tarifa-2" required></div>
                <div class="form-group"><label>3 Clases/sem ($)</label><input type="number" id="tarifa-3" required></div>
                <div class="form-group"><label>4 Clases/sem ($)</label><input type="number" id="tarifa-4" required></div>
                <div class="form-group"><label>5 Clases/sem ($)</label><input type="number" id="tarifa-5" required></div>
                <div style="display:flex; gap:6px;">
                    <button type="submit" class="btn btn-action btn-block">Guardar</button>
                    <button type="button" class="btn btn-danger btn-block" onclick="cerrarTarifasModal()">Cerrar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- BARRA SUPERIOR -->
    <div class="top-bar">
        <div class="user-info">
            <strong id="display-username">Usuario</strong>
            <span id="display-role" class="badge-status">Alumno</span>
            <span id="display-num-ficha" class="badge-info hidden">Ficha: --</span>
            <span id="display-payment" class="badge-status hidden">Estado Pago</span>
            <span id="display-arancel" class="badge-info hidden">Cuota: $0</span>
            <span id="display-creditos" class="badge-creditos hidden">Clases para recuperar: 0</span>
        </div>

        <div style="display: flex; gap: 8px; align-items: center;">
            <button class="btn" id="btn-prev-week">◀ Ant</button>
            <span id="semana-label" style="font-weight: bold; font-size: 0.85rem; min-width: 160px; text-align: center;">Semana --</span>
            <button class="btn" id="btn-next-week">Sig ▶</button>
        </div>

        <div id="admin-tools-header" class="nota-semanal-container hidden">
            <textarea id="nota-semanal-text" class="nota-semanal-input" placeholder="Nota semanal (Memoria)..."></textarea>
            <button class="btn btn-warning" onclick="abrirTarifasModal()" style="font-size:0.7rem; padding:6px 8px;">Tarifas</button>
        </div>

        <button class="btn btn-danger" id="btn-logout">Cerrar Sesión</button>
    </div>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="main-container">
        
        <!-- SIDEBAR ADMIN -->
        <div id="admin-sidebar" class="sidebar hidden">
            <h3 id="form-alta-title" style="margin:0; font-size: 0.95rem; border-bottom: 1px solid var(--grid-border); padding-bottom: 5px;">Alta de Alumno</h3>
            
            <form id="form-alta-alumno">
                <input type="hidden" id="admin-cli-id">
                <div class="form-group">
                    <label>Nombre y Apellido</label>
                    <input type="text" id="admin-cli-nombre" placeholder="Ej: Juan Perez" required>
                </div>
                <div class="form-group">
                    <label>Número Celular</label>
                    <input type="tel" id="admin-cli-celular" placeholder="Ej: 1123456789">
                </div>
                <div class="form-group">
                    <label>Clave de Acceso</label>
                    <input type="text" id="admin-cli-pass" placeholder="Ej: 456" required>
                </div>
                <div class="form-group">
                    <label>Fecha Último Pago</label>
                    <input type="date" id="admin-cli-fecha-pago" required>
                </div>

                <div style="border: 1px dashed var(--grid-border); padding: 8px; border-radius: 6px; margin-bottom: 10px;">
                    <label style="font-size:0.75rem; font-weight:bold; color:#3498db; display:block; margin-bottom:5px;">Horarios Fijos Recurrentes</label>
                    <div id="horarios-fijos-container"></div>
                    <button type="button" class="btn" id="btn-add-horario" style="font-size:0.7rem; padding:4px 8px; margin-top:5px;">+ Agregar Turno Fijo</button>
                </div>

                <div class="form-group" style="display:flex; align-items:center; gap:8px;">
                    <input type="checkbox" id="admin-cli-descuento" style="width:auto;">
                    <label for="admin-cli-descuento" style="margin:0;">Aplicar Descuento Especial (10%)</label>
                </div>

                <div style="font-size:0.8rem; margin-bottom:10px; color:#f1c40f;">
                    Cuota Mensual Estimada: <strong id="calculo-cuota-text">$0</strong>
                </div>

                <div style="display:flex; gap:6px;">
                    <button type="submit" id="btn-guardar-alumno" class="btn btn-action btn-block">Registrar Alumno</button>
                    <button type="button" id="btn-cancelar-edicion" class="btn btn-danger hidden" onclick="resetFormularioAlumno()">Cancelar</button>
                </div>
            </form>

            <h4 style="margin: 8px 0 4px 0; font-size: 0.85rem;">Alumnos Registrados</h4>
            <div id="lista-alumnos" style="flex:1; overflow-y:auto;"></div>
        </div>

        <!-- PIZARRA DE CAMAS -->
        <div class="pizarra-container">
            <div class="grid-header">
                <div>Hora</div>
                <div class="header-day">Lun <span id="h-0"></span><button id="btn-feriado-0" class="btn-feriado-toggle hidden" onclick="toggleFeriado(0)">Feriado</button></div>
                <div class="header-day">Mar <span id="h-1"></span><button id="btn-feriado-1" class="btn-feriado-toggle hidden" onclick="toggleFeriado(1)">Feriado</button></div>
                <div class="header-day">Mié <span id="h-2"></span><button id="btn-feriado-2" class="btn-feriado-toggle hidden" onclick="toggleFeriado(2)">Feriado</button></div>
                <div class="header-day">Jue <span id="h-3"></span><button id="btn-feriado-3" class="btn-feriado-toggle hidden" onclick="toggleFeriado(3)">Feriado</button></div>
                <div class="header-day">Vie <span id="h-4"></span><button id="btn-feriado-4" class="btn-feriado-toggle hidden" onclick="toggleFeriado(4)">Feriado</button></div>
                <div class="header-day">Sáb <span id="h-5"></span><button id="btn-feriado-5" class="btn-feriado-toggle hidden" onclick="toggleFeriado(5)">Feriado</button></div>
            </div>

            <div class="grid-body" id="grid-body"></div>
        </div>

    </div>

    <script>
        // CLIENTE SUPABASE (Reemplazar con credenciales reales)
        const SUPABASE_URL = 'https://TU-PROYECTO.supabase.co';
        const SUPABASE_KEY = 'TU-ANON-KEY';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const HORARIOS_LV = ["08:00", "09:00", "10:00", "11:00", "14:00", "15:00", "16:00", "17:00", "18:00", "19:00", "20:00"];
        const HORARIOS_SAB = ["09:00", "10:00", "11:00"];
        const CAMAS_MAX = 6;
        const DIAS_NOMBRES = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
        const MESES_ABREV = ["ENE", "FEB", "MAR", "ABR", "MAY", "JUN", "JUL", "AGO", "SEP", "OCT", "NOV", "DIC"];
        const TARIFAS_DEFAULT = { 1: 30000, 2: 35000, 3: 40000, 4: 45000, 5: 50000 };

        let dbAlumnos = [];
        let dbCancelaciones = {};
        let dbRecuperos = {};
        let dbNotas = {};
        let dbFeriados = {};
        let dbTarifas = {};

        let currentUser = null;
        let fechaReferencia = new Date();

        // SERVICIO DE ALMACENAMIENTO (Fallback LocalStorage + Supabase)
        const StorageService = {
            getAlumnos: () => JSON.parse(localStorage.getItem('pilates_v6_alumnos')) || [{ id: 'cli-admin', numFicha: '0000', nombre: 'admin', pass: '123', role: 'admin' }],
            saveAlumnos: (data) => localStorage.setItem('pilates_v6_alumnos', JSON.stringify(data)),
            getCancelaciones: () => JSON.parse(localStorage.getItem('pilates_v6_cancelaciones')) || {},
            saveCancelaciones: (data) => localStorage.setItem('pilates_v6_cancelaciones', JSON.stringify(data)),
            getRecuperos: () => JSON.parse(localStorage.getItem('pilates_v6_recuperos')) || {},
            saveRecuperos: (data) => localStorage.setItem('pilates_v6_recuperos', JSON.stringify(data)),
            getNotas: () => JSON.parse(localStorage.getItem('pilates_v6_notas')) || {},
            saveNotas: (data) => localStorage.setItem('pilates_v6_notas', JSON.stringify(data)),
            getFeriados: () => JSON.parse(localStorage.getItem('pilates_v6_feriados')) || {},
            saveFeriados: (data) => localStorage.setItem('pilates_v6_feriados', JSON.stringify(data)),
            getTarifas: () => JSON.parse(localStorage.getItem('pilates_v6_tarifas')) || TARIFAS_DEFAULT,
            saveTarifas: (data) => localStorage.setItem('pilates_v6_tarifas', JSON.stringify(data)),
            getSecuenciaFicha: () => parseInt(localStorage.getItem('pilates_v6_secuencia_ficha') || '1', 10),
            incrementarSecuenciaFicha: () => {
                let actual = StorageService.getSecuenciaFicha();
                localStorage.setItem('pilates_v6_secuencia_ficha', (actual + 1).toString());
                return actual;
            }
        };

        // EVENT LISTENERS
        document.getElementById('login-form').addEventListener('submit', handleLogin);
        document.getElementById('btn-logout').addEventListener('click', handleLogout);
        document.getElementById('form-alta-alumno').addEventListener('submit', handleGuardarAlumno);
        document.getElementById('btn-add-horario').addEventListener('click', () => { addHorarioSelector(); calcularCuotaFormulario(); });
        document.getElementById('btn-prev-week').addEventListener('click', () => cambiarSemana(-7));
        document.getElementById('btn-next-week').addEventListener('click', () => cambiarSemana(7));
        document.getElementById('nota-semanal-text').addEventListener('input', handleGuardarNota);
        document.getElementById('tarifas-form').addEventListener('submit', handleGuardarTarifas);
        document.getElementById('admin-cli-descuento').addEventListener('change', calcularCuotaFormulario);

        addHorarioSelector();

        function addHorarioSelector(diaDef = 0, horaDef = "08:00") {
            const container = document.getElementById('horarios-fijos-container');
            const div = document.createElement('div');
            div.className = 'horario-row';
            div.style.cssText = "display:flex; gap:4px; margin-bottom:5px;";

            let optDias = DIAS_NOMBRES.map((d, i) => `<option value="${i}" ${i == diaDef ? 'selected' : ''}>${d}</option>`).join('');
            let optHoras = HORARIOS_LV.map(h => `<option value="${h}" ${h == horaDef ? 'selected' : ''}>${h}</option>`).join('');

            div.innerHTML = `
                <select class="sel-dia" style="flex:1;">${optDias}</select>
                <select class="sel-hora" style="flex:1;">${optHoras}</select>
                <button type="button" class="btn btn-danger" onclick="this.parentElement.remove(); calcularCuotaFormulario();" style="padding:2px 6px;">X</button>
            `;
            container.appendChild(div);
        }

        function calcularCuotaFormulario() {
            dbTarifas = StorageService.getTarifas();
            const cantidadClases = document.querySelectorAll('.horario-row').length;
            const tieneDescuento = document.getElementById('admin-cli-descuento').checked;
            
            let base = dbTarifas[Math.min(Math.max(cantidadClases, 1), 5)] || 0;
            if (tieneDescuento) base = base * 0.90;

            document.getElementById('calculo-cuota-text').textContent = `$${base.toLocaleString('es-AR')} (${cantidadClases} clase/s por sem)`;
            return base;
        }

        function calcularEstadoPagoAlumno(alumno, lunesSemanaVisualizada) {
            if (!alumno || !alumno.fechaPago) return false;
            const fechaPago = new Date(alumno.fechaPago + 'T00:00:00');
            const finDeMesPagado = new Date(fechaPago.getFullYear(), fechaPago.getMonth() + 1, 0);
            return lunesSemanaVisualizada <= finDeMesPagado;
        }

        function handleLogin(e) {
            e.preventDefault();
            const userInput = document.getElementById('login-user').value.trim();
            const passInput = document.getElementById('login-pass').value.trim();

            dbAlumnos = StorageService.getAlumnos();

            if (userInput.toLowerCase() === 'admin' && passInput === '123') {
                currentUser = { id: 'cli-admin', numFicha: '0000', nombre: 'Administrador', role: 'admin' };
            } else {
                const alumno = dbAlumnos.find(a => a.nombre.toLowerCase() === userInput.toLowerCase() && a.pass === passInput && a.role === 'alumno');
                if (alumno) {
                    currentUser = alumno;
                } else {
                    alert('Usuario o clave incorrectos.');
                    return;
                }
            }

            document.getElementById('login-modal').classList.add('hidden');
            setupInterface();
        }

        function handleLogout() {
            currentUser = null;
            document.getElementById('login-modal').classList.remove('hidden');
            document.getElementById('login-form').reset();
        }

        function setupInterface() {
            document.getElementById('display-username').textContent = currentUser.nombre;
            document.getElementById('display-role').textContent = currentUser.role === 'admin' ? 'ADMIN' : 'ALUMNO';

            if (currentUser.role === 'admin') {
                document.getElementById('admin-sidebar').classList.remove('hidden');
                document.getElementById('admin-tools-header').classList.remove('hidden');
                document.getElementById('display-num-ficha').classList.add('hidden');
                document.getElementById('display-payment').classList.add('hidden');
                document.getElementById('display-arancel').classList.add('hidden');
                document.getElementById('display-creditos').classList.add('hidden');
                document.querySelectorAll('.btn-feriado-toggle').forEach(b => b.classList.remove('hidden'));
                renderListaAlumnos();
            } else {
                document.getElementById('admin-sidebar').classList.add('hidden');
                document.getElementById('admin-tools-header').classList.add('hidden');
                document.getElementById('display-num-ficha').classList.remove('hidden');
                document.getElementById('display-payment').classList.remove('hidden');
                document.getElementById('display-arancel').classList.remove('hidden');
                document.getElementById('display-creditos').classList.remove('hidden');
                document.querySelectorAll('.btn-feriado-toggle').forEach(b => b.classList.add('hidden'));

                document.getElementById('display-num-ficha').textContent = `Ficha: ${currentUser.numFicha || '----'}`;
                document.getElementById('display-arancel').textContent = `Cuota: $${(currentUser.arancel || 0).toLocaleString('es-AR')}`;

                actualizarCreditosDisplay();
            }

            renderGrid();
        }

        function actualizarCreditosDisplay() {
            if (!currentUser || currentUser.role === 'admin') return;

            dbAlumnos = StorageService.getAlumnos();
            const alumnoActualizado = dbAlumnos.find(a => a.id === currentUser.id);
            if (alumnoActualizado) currentUser = alumnoActualizado;

            const mesActual = new Date().getMonth();
            if (currentUser.creditosRecupero > 0 && currentUser.mesCredito !== undefined && currentUser.mesCredito !== mesActual) {
                currentUser.creditosRecupero = 0;
                const idx = dbAlumnos.findIndex(a => a.id === currentUser.id);
                if (idx !== -1) {
                    dbAlumnos[idx] = currentUser;
                    StorageService.saveAlumnos(dbAlumnos);
                }
            }

            const creditos = currentUser.creditosRecupero || 0;
            document.getElementById('display-creditos').textContent = `Clases para recuperar: ${creditos}`;
        }

        function handleGuardarAlumno(e) {
            e.preventDefault();
            const id = document.getElementById('admin-cli-id').value;
            const nombre = document.getElementById('admin-cli-nombre').value.trim();
            const celular = document.getElementById('admin-cli-celular').value.trim();
            const pass = document.getElementById('admin-cli-pass').value.trim();
            const fechaPago = document.getElementById('admin-cli-fecha-pago').value;
            const tieneDescuento = document.getElementById('admin-cli-descuento').checked;

            dbAlumnos = StorageService.getAlumnos();

            if (!id) {
                const existe = dbAlumnos.some(a => a.nombre.toLowerCase() === nombre.toLowerCase());
                if (existe) {
                    alert(`Error: Ya existe un alumno registrado como "${nombre}".`);
                    return;
                }
            }

            const rows = document.querySelectorAll('.horario-row');
            const turnosFijos = [];
            rows.forEach(r => {
                const dia = parseInt(r.querySelector('.sel-dia').value);
                const hora = r.querySelector('.sel-hora').value;
                turnosFijos.push({ dia, hora, slotKey: `${hora}-d${dia}` });
            });

            if (turnosFijos.length === 0) {
                alert("Debes asignar al menos 1 turno fijo semanal.");
                return;
            }

            const arancel = calcularCuotaFormulario();

            if (id) {
                const idx = dbAlumnos.findIndex(a => a.id === id);
                if (idx !== -1) {
                    dbAlumnos[idx].nombre = nombre;
                    dbAlumnos[idx].celular = celular;
                    dbAlumnos[idx].pass = pass;
                    dbAlumnos[idx].fechaPago = fechaPago;
                    dbAlumnos[idx].turnosFijos = turnosFijos;
                    dbAlumnos[idx].descuento = tieneDescuento;
                    dbAlumnos[idx].arancel = arancel;
                }
                alert(`Alumno ${nombre} actualizado correctamente.`);
            } else {
                const sec = StorageService.incrementarSecuenciaFicha();
                const numFicha = sec.toString().padStart(4, '0');

                const nuevo = {
                    id: 'cli-' + Date.now(),
                    numFicha,
                    nombre,
                    celular,
                    pass,
                    fechaPago,
                    role: 'alumno',
                    turnosFijos,
                    descuento: tieneDescuento,
                    arancel,
                    creditosRecupero: 0,
                    mesCredito: new Date().getMonth()
                };
                dbAlumnos.push(nuevo);
                alert(`Alumno ${nombre} registrado con éxito. Ficha N°: ${numFicha}`);
            }

            StorageService.saveAlumnos(dbAlumnos);
            resetFormularioAlumno();
            renderListaAlumnos();
            renderGrid();
        }

        function editarAlumno(id) {
            dbAlumnos = StorageService.getAlumnos();
            const alumno = dbAlumnos.find(a => a.id === id);
            if (!alumno) return;

            document.getElementById('form-alta-title').textContent = `Editar Alumno (Ficha ${alumno.numFicha})`;
            document.getElementById('admin-cli-id').value = alumno.id;
            document.getElementById('admin-cli-nombre').value = alumno.nombre;
            document.getElementById('admin-cli-celular').value = alumno.celular || '';
            document.getElementById('admin-cli-pass').value = alumno.pass;
            document.getElementById('admin-cli-fecha-pago').value = alumno.fechaPago || '';
            document.getElementById('admin-cli-descuento').checked = !!alumno.descuento;

            const container = document.getElementById('horarios-fijos-container');
            container.innerHTML = '';
            if (alumno.turnosFijos && alumno.turnosFijos.length > 0) {
                alumno.turnosFijos.forEach(tf => addHorarioSelector(tf.dia, tf.hora));
            } else {
                addHorarioSelector();
            }

            calcularCuotaFormulario();

            document.getElementById('btn-guardar-alumno').textContent = "Guardar Cambios";
            document.getElementById('btn-cancelar-edicion').classList.remove('hidden');
        }

        function resetFormularioAlumno() {
            document.getElementById('form-alta-title').textContent = "Alta de Alumno";
            document.getElementById('admin-cli-id').value = '';
            document.getElementById('form-alta-alumno').reset();
            document.getElementById('horarios-fijos-container').innerHTML = '';
            addHorarioSelector();
            calcularCuotaFormulario();
            document.getElementById('btn-guardar-alumno').textContent = "Registrar Alumno";
            document.getElementById('btn-cancelar-edicion').classList.add('hidden');
        }

        function renderListaAlumnos() {
            const container = document.getElementById('lista-alumnos');
            container.innerHTML = '';
            
            dbAlumnos = StorageService.getAlumnos();
            const lunesSemanaActual = getLunesDeSemana(fechaReferencia);
            
            dbAlumnos.filter(a => a.role === 'alumno').forEach(a => {
                const card = document.createElement('div');
                card.className = 'alumno-card';
                
                let resumenFijos = a.turnosFijos ? a.turnosFijos.map(tf => `${DIAS_NOMBRES[tf.dia].slice(0,3)} ${tf.hora}`).join(', ') : 'Sin turnos';
                const esPago = calcularEstadoPagoAlumno(a, lunesSemanaActual);

                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <strong>N° ${a.numFicha || '----'} - ${a.nombre}</strong>
                        <span class="badge-status ${esPago ? '' : 'inactive'}" style="font-size:0.65rem;">
                            ${esPago ? 'PAGO ACTIVO' : 'PAGO PENDIENTE'}
                        </span>
                    </div>
                    <span style="color:#aaa;">Cel: ${a.celular || 'S/N'} | Clave: ${a.pass}</span><br>
                    <span style="color:#aaa;">Fijos: ${resumenFijos}</span><br>
                    <span style="color:#8a8a93;">Cuota: $${(a.arancel || 0).toLocaleString('es-AR')} ${a.descuento ? '(10% Off)' : ''}</span> | 
                    <span style="color:#f39c12; font-weight:bold;">Recuperos: ${a.creditosRecupero || 0}</span>
                    <div class="alumno-actions">
                        <button class="btn btn-warning" style="padding:2px 6px; font-size:0.65rem;" onclick="editarAlumno('${a.id}')">Editar</button>
                        <button class="btn btn-danger" style="padding:2px 6px; font-size:0.65rem;" onclick="eliminarAlumno('${a.id}')">Eliminar</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function eliminarAlumno(id) {
            if (!confirm("¿Eliminar este alumno y sus registros asociados?")) return;
            dbAlumnos = StorageService.getAlumnos().filter(a => a.id !== id);
            StorageService.saveAlumnos(dbAlumnos);
            renderListaAlumnos();
            renderGrid();
        }

        function abrirTarifasModal() {
            dbTarifas = StorageService.getTarifas();
            document.getElementById('tarifa-1').value = dbTarifas[1] || 30000;
            document.getElementById('tarifa-2').value = dbTarifas[2] || 35000;
            document.getElementById('tarifa-3').value = dbTarifas[3] || 40000;
            document.getElementById('tarifa-4').value = dbTarifas[4] || 45000;
            document.getElementById('tarifa-5').value = dbTarifas[5] || 50000;
            document.getElementById('tarifas-modal').classList.remove('hidden');
        }

        function cerrarTarifasModal() {
            document.getElementById('tarifas-modal').classList.add('hidden');
        }

        function handleGuardarTarifas(e) {
            e.preventDefault();
            dbTarifas = {
                1: parseInt(document.getElementById('tarifa-1').value, 10),
                2: parseInt(document.getElementById('tarifa-2').value, 10),
                3: parseInt(document.getElementById('tarifa-3').value, 10),
                4: parseInt(document.getElementById('tarifa-4').value, 10),
                5: parseInt(document.getElementById('tarifa-5').value, 10)
            };
            StorageService.saveTarifas(dbTarifas);
            cerrarTarifasModal();
            calcularCuotaFormulario();
            alert("Tarifas actualizadas correctamente.");
        }

        function getSemanaKey(fecha) {
            const d = new Date(Date.UTC(fecha.getFullYear(), fecha.getMonth(), fecha.getDate()));
            const dayNum = d.getUTCDay() || 7;
            d.setUTCDate(d.getUTCDate() + 4 - dayNum);
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
            return `${d.getUTCFullYear()}-W${weekNo}`;
        }

        function getNumeroSemana(fecha) {
            const d = new Date(Date.UTC(fecha.getFullYear(), fecha.getMonth(), fecha.getDate()));
            const dayNum = d.getUTCDay() || 7;
            d.setUTCDate(d.getUTCDate() + 4 - dayNum);
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
        }

        function cambiarSemana(dias) {
            fechaReferencia.setDate(fechaReferencia.getDate() + dias);
            renderGrid();
        }

        function getLunesDeSemana(fecha) {
            const d = new Date(fecha);
            d.setHours(0, 0, 0, 0);
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(d.setDate(diff));
        }

        function handleGuardarNota() {
            const semanaKey = getSemanaKey(fechaReferencia);
            dbNotas[semanaKey] = document.getElementById('nota-semanal-text').value;
            StorageService.saveNotas(dbNotas);
        }

        function toggleFeriado(diaIndex) {
            const semanaKey = getSemanaKey(fechaReferencia);
            if (!dbFeriados[semanaKey]) dbFeriados[semanaKey] = {};
            dbFeriados[semanaKey][diaIndex] = !dbFeriados[semanaKey][diaIndex];
            StorageService.saveFeriados(dbFeriados);
            renderGrid();
        }

        function renderGrid() {
            const gridBody = document.getElementById('grid-body');
            gridBody.innerHTML = '';

            dbCancelaciones = StorageService.getCancelaciones();
            dbRecuperos = StorageService.getRecuperos();
            dbAlumnos = StorageService.getAlumnos();
            dbNotas = StorageService.getNotas();
            dbFeriados = StorageService.getFeriados();

            const lunesActual = getLunesDeSemana(fechaReferencia);
            const semanaKey = getSemanaKey(fechaReferencia);
            const numSemana = getNumeroSemana(fechaReferencia);
            const mesNombre = MESES_ABREV[lunesActual.getMonth()];
            const anio = lunesActual.getFullYear();

            document.getElementById('semana-label').textContent = `Semana ${numSemana} - ${mesNombre} ${anio}`;
            document.getElementById('nota-semanal-text').value = dbNotas[semanaKey] || '';

            if (currentUser && currentUser.role === 'alumno') {
                const aActual = dbAlumnos.find(a => a.id === currentUser.id);
                if (aActual) currentUser = aActual;

                const pagoActivoSemana = calcularEstadoPagoAlumno(currentUser, lunesActual);
                const displayPayment = document.getElementById('display-payment');
                displayPayment.textContent = pagoActivoSemana ? 'PAGO ACTIVO' : 'PAGO PENDIENTE';
                displayPayment.className = `badge-status ${pagoActivoSemana ? '' : 'inactive'}`;
            }

            const feriadosSemana = dbFeriados[semanaKey] || {};

            for (let i = 0; i < 6; i++) {
                const d = new Date(lunesActual);
                d.setDate(d.getDate() + i);
                document.getElementById(`h-${i}`).textContent = `${d.getDate()}/${d.getMonth()+1}`;
                
                const btnFer = document.getElementById(`btn-feriado-${i}`);
                if (btnFer) {
                    if (feriadosSemana[i]) {
                        btnFer.classList.add('active');
                        btnFer.textContent = "Feriado ✔";
                    } else {
                        btnFer.classList.remove('active');
                        btnFer.textContent = "Feriado";
                    }
                }
            }

            HORARIOS_LV.forEach(hora => {
                const row = document.createElement('div');
                row.className = 'grid-row';

                const timeCell = document.createElement('div');
                timeCell.className = 'time-cell';
                timeCell.textContent = hora;
                row.appendChild(timeCell);

                for (let dia = 0; dia < 6; dia++) {
                    const slotCell = document.createElement('div');
                    slotCell.className = 'slot-cell';

                    if (feriadosSemana[dia]) {
                        slotCell.classList.add('feriado-col');
                    }

                    if (dia === 5 && !HORARIOS_SAB.includes(hora)) {
                        slotCell.classList.add('disabled-slot');
                        row.appendChild(slotCell);
                        continue;
                    }

                    const slotKey = `${hora}-d${dia}`;
                    const ocupantes = getOcupantesSlot(semanaKey, slotKey);
                    const disponibles = CAMAS_MAX - ocupantes.length;

                    const info = document.createElement('div');
                    info.className = 'slot-info';
                    info.textContent = feriadosSemana[dia] ? 'FERIADO' : `${disponibles} de ${CAMAS_MAX} Libres`;
                    slotCell.appendChild(info);

                    ocupantes.forEach(cli => {
                        const esMio = currentUser && cli.id === currentUser.id;

                        if (currentUser && currentUser.role === 'admin') {
                            const ficha = document.createElement('div');
                            ficha.className = 'ficha';
                            ficha.innerHTML = `<span>${cli.numFicha || ''} ${cli.nombre}</span>`;
                            ficha.title = "Admin: Haz clic para cancelar este turno";
                            ficha.style.cursor = "pointer";
                            ficha.onclick = () => adminRemoverOcupante(semanaKey, slotKey, cli.id);
                            slotCell.appendChild(ficha);
                        } else if (esMio) {
                            const ficha = document.createElement('div');
                            ficha.className = 'ficha propia';
                            ficha.innerHTML = `<span>Tu Clase</span>`;
                            ficha.title = "Haz clic para cancelar esta clase";
                            ficha.onclick = () => alumnoCancelarClase(semanaKey, slotKey, dia, hora);
                            slotCell.appendChild(ficha);
                        } else {
                            const ficha = document.createElement('div');
                            ficha.className = 'ficha';
                            ficha.style.opacity = '0.6';
                            ficha.innerHTML = `<span>Ocupado</span>`;
                            slotCell.appendChild(ficha);
                        }
                    });

                    if (currentUser && currentUser.role === 'alumno' && disponibles > 0 && !feriadosSemana[dia]) {
                        const estaAnotado = ocupantes.some(a => a.id === currentUser.id);
                        const creditosDisponibles = currentUser.creditosRecupero || 0;

                        if (!estaAnotado && creditosDisponibles > 0) {
                            const btnReserva = document.createElement('button');
                            btnReserva.className = 'slot-reserva-btn';
                            btnReserva.textContent = '+ Agendar';
                            btnReserva.onclick = () => alumnoRecuperarClase(semanaKey, slotKey);
                            slotCell.appendChild(btnReserva);
                        }
                    }

                    if (currentUser && currentUser.role === 'admin' && disponibles > 0 && !feriadosSemana[dia]) {
                        const alumnosConCredito = dbAlumnos.filter(a => a.role === 'alumno' && (a.creditosRecupero || 0) > 0 && !ocupantes.some(o => o.id === a.id));
                        if (alumnosConCredito.length > 0) {
                            const btnAdminRec = document.createElement('button');
                            btnAdminRec.className = 'slot-admin-recupero-btn';
                            btnAdminRec.textContent = '+ Asignar Recupero';
                            btnAdminRec.onclick = () => adminAsignarRecuperoManual(semanaKey, slotKey, alumnosConCredito);
                            slotCell.appendChild(btnAdminRec);
                        }
                    }

                    row.appendChild(slotCell);
                }

                gridBody.appendChild(row);
            });
        }

        function getOcupantesSlot(semanaKey, slotKey) {
            let ocupantes = [];

            dbAlumnos.filter(a => a.role === 'alumno').forEach(cli => {
                const tieneFijo = cli.turnosFijos && cli.turnosFijos.some(tf => tf.slotKey === slotKey);
                if (tieneFijo) {
                    const cancelo = dbCancelaciones[semanaKey] && dbCancelaciones[semanaKey][slotKey] && dbCancelaciones[semanaKey][slotKey].includes(cli.id);
                    if (!cancelo) {
                        ocupantes.push(cli);
                    }
                }
            });

            if (dbRecuperos[semanaKey] && dbRecuperos[semanaKey][slotKey]) {
                dbRecuperos[semanaKey][slotKey].forEach(cliId => {
                    const cli = dbAlumnos.find(a => a.id === cliId);
                    if (cli && !ocupantes.some(o => o.id === cli.id)) {
                        ocupantes.push(cli);
                    }
                });
            }

            return ocupantes;
        }

        function alumnoCancelarClase(semanaKey, slotKey, dia, hora) {
            const lunesActual = getLunesDeSemana(fechaReferencia);
            const fechaClase = new Date(lunesActual);
            fechaClase.setDate(fechaClase.getDate() + dia);
            
            const [h, m] = hora.split(':');
            fechaClase.setHours(parseInt(h, 10), parseInt(m, 10), 0, 0);

            const ahora = new Date();
            const msDiferencia = fechaClase.getTime() - ahora.getTime();
            const diferenciaHoras = msDiferencia / (1000 * 60 * 60);

            if (diferenciaHoras < 2) {
                if (diferenciaHoras < 0) {
                    alert("No puedes cancelar una clase pasada.");
                } else {
                    alert(`Debes cancelar con al menos 2 horas de anticipación.\n(Faltan ${diferenciaHoras.toFixed(1)} hs).`);
                }
                return;
            }

            if (!confirm("¿Deseas cancelar esta clase? Obtendrás 1 crédito de recupero.")) return;

            if (!dbCancelaciones[semanaKey]) dbCancelaciones[semanaKey] = {};
            if (!dbCancelaciones[semanaKey][slotKey]) dbCancelaciones[semanaKey][slotKey] = [];
            dbCancelaciones[semanaKey][slotKey].push(currentUser.id);
            StorageService.saveCancelaciones(dbCancelaciones);

            if (dbRecuperos[semanaKey] && dbRecuperos[semanaKey][slotKey]) {
                dbRecuperos[semanaKey][slotKey] = dbRecuperos[semanaKey][slotKey].filter(id => id !== currentUser.id);
                StorageService.saveRecuperos(dbRecuperos);
            }

            currentUser.creditosRecupero = (currentUser.creditosRecupero || 0) + 1;
            currentUser.mesCredito = new Date().getMonth();
            
            const idx = dbAlumnos.findIndex(a => a.id === currentUser.id);
            if (idx !== -1) dbAlumnos[idx] = currentUser;
            StorageService.saveAlumnos(dbAlumnos);

            actualizarCreditosDisplay();
            renderGrid();
            alert("Clase cancelada. Tienes 1 crédito para recupero de clase.");
        }

        function alumnoRecuperarClase(semanaKey, slotKey) {
            if ((currentUser.creditosRecupero || 0) <= 0) {
                alert("No tienes clases para recuperar.");
                return;
            }

            if (!confirm("¿Deseas usar 1 crédito para agendar este recupero de clase?")) return;

            if (!dbRecuperos[semanaKey]) dbRecuperos[semanaKey] = {};
            if (!dbRecuperos[semanaKey][slotKey]) dbRecuperos[semanaKey][slotKey] = [];
            dbRecuperos[semanaKey][slotKey].push(currentUser.id);
            StorageService.saveRecuperos(dbRecuperos);

            currentUser.creditosRecupero -= 1;
            const idx = dbAlumnos.findIndex(a => a.id === currentUser.id);
            if (idx !== -1) dbAlumnos[idx] = currentUser;
            StorageService.saveAlumnos(dbAlumnos);

            actualizarCreditosDisplay();
            renderGrid();
        }

        function adminAsignarRecuperoManual(semanaKey, slotKey, alumnosDisponibles) {
            let listadoText = alumnosDisponibles.map(a => `• N° ${a.numFicha} - ${a.nombre} (Créditos: ${a.creditosRecupero})`).join('\n');
            let inputFicha = prompt(`Alumnos habilitados con clases a recuperar:\n\n${listadoText}\n\nIngresa el N° de Ficha (Ej: 0001):`);

            if (!inputFicha) return;
            inputFicha = inputFicha.trim().padStart(4, '0');

            const alumnoSel = alumnosDisponibles.find(a => a.numFicha === inputFicha);

            if (!alumnoSel) {
                alert("Número de ficha no encontrado en la lista de alumnos con créditos disponibles.");
                return;
            }

            if (!dbRecuperos[semanaKey]) dbRecuperos[semanaKey] = {};
            if (!dbRecuperos[semanaKey][slotKey]) dbRecuperos[semanaKey][slotKey] = [];
            dbRecuperos[semanaKey][slotKey].push(alumnoSel.id);
            StorageService.saveRecuperos(dbRecuperos);

            const dbIdx = dbAlumnos.findIndex(a => a.id === alumnoSel.id);
            if (dbIdx !== -1) {
                dbAlumnos[dbIdx].creditosRecupero -= 1;
                StorageService.saveAlumnos(dbAlumnos);
            }

            renderListaAlumnos();
            renderGrid();
            alert(`Recupero asignado a ${alumnoSel.nombre} (Ficha ${alumnoSel.numFicha}).`);
        }

        function adminRemoverOcupante(semanaKey, slotKey, cliId) {
            if (!confirm("Admin: ¿Forzar cancelación de este turno y sumar 1 crédito de recupero al alumno?")) return;

            if (!dbCancelaciones[semanaKey]) dbCancelaciones[semanaKey] = {};
            if (!dbCancelaciones[semanaKey][slotKey]) dbCancelaciones[semanaKey][slotKey] = [];
            dbCancelaciones[semanaKey][slotKey].push(cliId);
            StorageService.saveCancelaciones(dbCancelaciones);

            if (dbRecuperos[semanaKey] && dbRecuperos[semanaKey][slotKey]) {
                dbRecuperos[semanaKey][slotKey] = dbRecuperos[semanaKey][slotKey].filter(id => id !== cliId);
                StorageService.saveRecuperos(dbRecuperos);
            }

            dbAlumnos = StorageService.getAlumnos();
            const cliIndex = dbAlumnos.findIndex(a => a.id === cliId);
            if (cliIndex !== -1) {
                dbAlumnos[cliIndex].creditosRecupero = (dbAlumnos[cliIndex].creditosRecupero || 0) + 1;
                dbAlumnos[cliIndex].mesCredito = new Date().getMonth();
                StorageService.saveAlumnos(dbAlumnos);
            }

            renderListaAlumnos();
            renderGrid();
        }
    </script>
</body>
