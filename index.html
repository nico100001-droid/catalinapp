<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestión - Pilates Studio</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg-main: #f8fafc;
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

    /* Layout */
    #sidebar { width: 320px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 1.5rem; gap: 1.5rem; overflow-y: auto; }
    #main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }

    /* UI Components */
    .btn { padding: 0.6rem 1rem; border-radius: 0.375rem; border: none; font-weight: 500; cursor: pointer; transition: background 0.2s; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-danger { background: var(--danger); color: white; }
    .btn-secondary { background: #e2e8f0; color: var(--text-main); }
    
    .input-field { width: 100%; padding: 0.6rem; border: 1px solid var(--border); border-radius: 0.375rem; margin-top: 0.25rem; margin-bottom: 0.75rem; }
    
    /* Grid Agenda */
    .grid-container { flex: 1; overflow: auto; padding: 1.5rem; display: grid; grid-template-columns: repeat(6, minmax(160px, 1fr)); gap: 1rem; }
    .day-column { background: var(--surface); border: 1px solid var(--border); border-radius: 0.5rem; display: flex; flex-direction: column; }
    .day-header { padding: 0.75rem; border-bottom: 1px solid var(--border); text-align: center; font-weight: 600; background: #f1f5f9; }
    .day-header.feriado { background: #fee2e2; color: var(--danger); }
    
    .slot-card { padding: 0.75rem; border-bottom: 1px solid var(--border); font-size: 0.875rem; }
    .slot-card.lleno { background: #fef2f2; }
    .slot-header { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 0.5rem; }
    
    .occupant-list { list-style: none; margin-bottom: 0.5rem; }
    .occupant-item { display: flex; justify-content: space-between; align-items: center; padding: 0.2rem 0; font-size: 0.8rem; }
    .badge-recupero { background: #fef3c7; color: #92400e; padding: 0.1rem 0.3rem; border-radius: 0.25rem; font-size: 0.7rem; }

    /* Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: var(--surface); padding: 1.5rem; border-radius: 0.5rem; width: 100%; max-width: 450px; }
  </style>
</head>
<body>

  <!-- Sidebar: Administración y Filtros -->
  <aside id="sidebar">
    <h2>Control de Gestión</h2>
    
    <div>
      <label for="select-vista">Modo de Vista</label>
      <select id="select-vista" class="input-field" onchange="cambiarVista()">
        <option value="admin">Administrador</option>
        <option value="alumno">Alumno</option>
      </select>
    </div>

    <div id="seccion-alumno-login" style="display: none;">
      <label for="select-alumno-activo">Seleccionar Alumno Activo</label>
      <select id="select-alumno-activo" class="input-field" onchange="actualizarVistaAlumno()">
        <!-- Opciones dinámicas -->
      </select>
      <div id="creditos-info" style="font-size: 0.85rem; color: var(--primary); font-weight: 600;"></div>
    </div>

    <div id="seccion-admin">
      <button class="btn btn-primary" style="width: 100%;" onclick="abrirModalAltaAlumno()">+ Registrar Nuevo Alumno</button>
      
      <hr style="margin: 1.5rem 0; border: none; border-top: 1px solid var(--border);">
      
      <h3>Alumnos Registrados</h3>
      <input type="search" id="busqueda-alumno" class="input-field" placeholder="Buscar por nombre o ID..." oninput="filtrarAlumnos()">
      <div id="lista-alumnos" style="max-height: 300px; overflow-y: auto;">
        <!-- Lista dinámica -->
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main id="main-content">
    <header>
      <div>
        <h1 id="titulo-semana">Agenda Semanal</h1>
        <span id="rango-fechas" style="color: var(--text-muted); font-size: 0.875rem;"></span>
      </div>
      <div>
        <button class="btn btn-secondary" onclick="navegarSemana(-1)">&lt; Anterior</button>
        <button class="btn btn-secondary" onclick="navegarSemana(0)">Hoy</button>
        <button class="btn btn-secondary" onclick="navegarSemana(1)">Siguiente &gt;</button>
      </div>
    </header>

    <div class="grid-container" id="grid-agenda">
      <!-- Grid Dinámica -->
    </div>
  </main>

  <!-- Modal Alta Alumno -->
  <div class="modal-overlay" id="modal-alta">
    <div class="modal-content">
      <h3>Alta de Alumno</h3>
      <form id="form-alta" onsubmit="guardarAlumno(event)">
        <label>Nombre Completo</label>
        <input type="text" id="alta-nombre" class="input-field" required>
        
        <label>Frecuencia Semanal</label>
        <select id="alta-frecuencia" class="input-field" onchange="actualizarMontoCuota()">
          <option value="1">1 Clase por semana</option>
          <option value="2">2 Clases por semana</option>
          <option value="3">3 Clases por semana</option>
          <option value="4">4 Clases por semana</option>
          <option value="5">5 Clases por semana</option>
        </select>
        
        <label>Monto Cuota Calculado</label>
        <input type="text" id="alta-cuota" class="input-field" readonly>

        <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1rem;">
          <button type="button" class="btn btn-secondary" onclick="cerrarModalAlta()">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // CREDENCIALES SUPABASE
    const SUPABASE_URL = 'https://bgrhwfutbmoktvdziamk.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJncmh3ZnV0Ym1va3R2ZHppYW1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3ODU4NTYsImV4cCI6MjEwNDM2MTg1Nn0.1EjgnUOR3IwUmf_veno-oQZ4pEHKhbKElW0-AId2VZg';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // CONSTANTES Y ESTADO
    const CAMAS_MAX = 6;
    const TARIFAS_DEFAULT = { 1: 30000, 2: 35000, 3: 40000, 4: 45000, 5: 50000 };
    const HORARIOS = ["08:00", "09:00", "10:00", "16:00", "17:00", "18:00", "19:00"];
    
    let fechaReferencia = new Date();
    let dbAlumnos = [];
    let dbFeriados = [];
    let dbReservas = [];
    let modoVista = 'admin';
    let alumnoActivoId = null;

    // INICIALIZACIÓN
    window.addEventListener('DOMContentLoaded', async () => {
      await cargarDatosSupabase();
      renderGrid();
      renderListaAlumnos();
    });

    async function cargarDatosSupabase() {
      // Cargar Feriados
      const { data: feriados } = await supabase.from('feriado').select('*');
      if (feriados) dbFeriados = feriados;

      // Cargar Alumnos
      const { data: alumnos } = await supabase.from('alumnos').select('*');
      if (alumnos) {
        dbAlumnos = alumnos;
        poblarSelectAlumnos();
      }

      // Cargar Reservas
      const { data: reservas } = await supabase.from('reservas').select('*');
      if (reservas) dbReservas = reservas;
    }

    // REGISTRO DE FERIADOS EN SUPABASE
    async function toggleFeriado(fechaIso) {
      if (modoVista !== 'admin') return;

      const existe = dbFeriados.find(f => f.fecha === fechaIso);
      if (existe) {
        await supabase.from('feriado').delete().eq('fecha', fechaIso);
        dbFeriados = dbFeriados.filter(f => f.fecha !== fechaIso);
      } else {
        const nuevo = { fecha: fechaIso, obs: 'Día No Laborable' };
        const { data } = await supabase.from('feriado').insert([nuevo]).select();
        if (data) dbFeriados.push(data[0]);
      }
      renderGrid();
    }

    // LÓGICA DE CANCELACIÓN Y REGLAS DE NEGOCIO
    async function cancelarTurno(reservaId, fechaIso, hora) {
      const horaActual = new Date();
      const fechaTurno = new Date(`${fechaIso}T${hora}:00`);

      // 1. Restricción por fechas pasadas
      if (fechaTurno < horaActual) {
        alert("No es posible cancelar turnos correspondientes a fechas o horarios ya transcurridos.");
        return;
      }

      // 2. Control de antelación (mínimo 2 horas = 7,200,000 ms)
      const diferenciaMs = fechaTurno - horaActual;
      const tieneAntelaciónSuficiente = diferenciaMs >= (2 * 60 * 60 * 1000);

      if (!tieneAntelaciónSuficiente) {
        alert("Las cancelaciones deben realizarse con un mínimo de 2 horas de antelación. La clase se dará por perdida sin generación de crédito.");
      }

      // Eliminar reserva
      await supabase.from('reservas').delete().eq('id', reservaId);
      dbReservas = dbReservas.filter(r => r.id !== reservaId);

      // Si cumple antelación, asignar crédito de recupero al alumno dentro del mismo mes
      if (tieneAntelaciónSuficiente && alumnoActivoId) {
        const alumno = dbAlumnos.find(a => a.id === alumnoActivoId);
        if (alumno) {
          const mesTurno = fechaIso.substring(0, 7);
          const creditosActuales = alumno.clases_a_recuperar || 0;
          
          await supabase.from('alumnos').update({
            clases_a_recuperar: creditosActuales + 1,
            mes_creditos_vigente: mesTurno
          }).eq('id', alumno.id);

          alumno.clases_a_recuperar = creditosActuales + 1;
          alumno.mes_creditos_vigente = mesTurno;
        }
      }

      actualizarVistaAlumno();
      renderGrid();
    }

    // RESERVA DE TURNOS / RECUPEROS
    async function agendarTurno(fechaIso, hora) {
      const ocupantes = getOcupantesSlot(fechaIso, hora);

      // 1. Límite estricto de 6 camas
      if (ocupantes.length >= CAMAS_MAX) {
        alert("Atención: Este turno ya alcanzó el límite de 6 camas.");
        return;
      }

      if (!alumnoActivoId) {
        alert("Seleccione un alumno para agendar.");
        return;
      }

      const alumno = dbAlumnos.find(a => a.id === alumnoActivoId);
      const mesTurno = fechaIso.substring(0, 7);

      // Validar si es uso de crédito de recupero
      let esRecupero = false;
      if (alumno.clases_a_recuperar > 0) {
        if (alumno.mes_creditos_vigente !== mesTurno) {
          alert("El crédito de recupero caducó. Solo es válido para el mismo mes calendario en que ocurrió la cancelación.");
          return;
        }
        esRecupero = true;
      }

      const nuevaReserva = {
        alumno_id: alumno.id,
        fecha: fechaIso,
        hora: hora,
        es_recupero: esRecupero
      };

      const { data } = await supabase.from('reservas').insert([nuevaReserva]).select();
      if (data) {
        dbReservas.push(data[0]);

        if (esRecupero) {
          const nuevosCreditos = alumno.clases_a_recuperar - 1;
          await supabase.from('alumnos').update({ clases_a_recuperar: nuevosCreditos }).eq('id', alumno.id);
          alumno.clases_a_recuperar = nuevosCreditos;
        }
      }

      actualizarVistaAlumno();
      renderGrid();
    }

    // FILTRADO DINÁMICO DE ALUMNOS
    function filtrarAlumnos() {
      const busqueda = document.getElementById('busqueda-alumno').value.toLowerCase().trim();
      const contenedor = document.getElementById('lista-alumnos');
      contenedor.innerHTML = '';

      const filtrados = dbAlumnos.filter(a => 
        a.nombre.toLowerCase().includes(busqueda) || String(a.id).includes(busqueda)
      );

      filtrados.forEach(a => {
        const div = document.createElement('div');
        div.style.padding = '0.4rem 0';
        div.style.borderBottom = '1px solid var(--border)';
        div.style.fontSize = '0.85rem';
        div.innerHTML = `<strong>ID: ${a.id}</strong> - ${a.nombre} (${a.frecuencia_semanal}x/sem)`;
        contenedor.appendChild(div);
      });
    }

    function renderListaAlumnos() {
      filtrarAlumnos();
    }

    // AUXILIARES DE RENDERIZADO Y NAVEGACIÓN
    function getOcupantesSlot(fechaIso, hora) {
      return dbReservas.filter(r => r.fecha === fechaIso && r.hora === hora);
    }

    function renderGrid() {
      const grid = document.getElementById('grid-agenda');
      grid.innerHTML = '';

      const inicioSemana = getLunes(fechaReferencia);

      for (let i = 0; i < 6; i++) {
        const diaActual = new Date(inicioSemana);
        diaActual.setDate(diaActual.getDate() + i);
        const fechaIso = diaActual.toISOString().split('T')[0];
        
        const esFeriado = dbFeriados.some(f => f.fecha === fechaIso);

        const col = document.createElement('div');
        col.className = 'day-column';
        
        const header = document.createElement('div');
        header.className = `day-header ${esFeriado ? 'feriado' : ''}`;
        header.innerHTML = `
          <div>${diaActual.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric' })}</div>
          ${modoVista === 'admin' ? `<button style="font-size:0.65rem; margin-top:0.2rem;" onclick="toggleFeriado('${fechaIso}')">${esFeriado ? 'Habilitar' : 'Feriado'}</button>` : ''}
        `;
        col.appendChild(header);

        if (esFeriado) {
          const msg = document.createElement('div');
          msg.style.padding = '1rem';
          msg.style.textAlign = 'center';
          msg.style.color = 'var(--danger)';
          msg.style.fontSize = '0.85rem';
          msg.innerText = 'Día No Laborable';
          col.appendChild(msg);
        } else {
          HORARIOS.forEach(hora => {
            const ocupantes = getOcupantesSlot(fechaIso, hora);
            // Corrección de lugares disponibles: no cae por debajo de cero
            const disponibles = Math.max(0, CAMAS_MAX - ocupantes.length);

            const card = document.createElement('div');
            card.className = `slot-card ${disponibles === 0 ? 'lleno' : ''}`;
            
            let htmlOcupantes = '<ul class="occupant-list">';
            ocupantes.forEach(o => {
              const al = dbAlumnos.find(a => a.id === o.alumno_id);
              const nombre = al ? al.nombre : 'Alumno';
              const esPropio = alumnoActivoId && o.alumno_id === alumnoActivoId;
              
              htmlOcupantes += `
                <li class="occupant-item">
                  <span>${nombre} ${o.es_recupero ? '<span class="badge-recupero">R</span>' : ''}</span>
                  ${(modoVista === 'admin' || esPropio) ? `<button class="btn-danger" style="padding:0.1rem 0.3rem; font-size:0.65rem;" onclick="cancelarTurno('${o.id}', '${fechaIso}', '${hora}')">X</button>` : ''}
                </li>
              `;
            });
            htmlOcupantes += '</ul>';

            card.innerHTML = `
              <div class="slot-header">
                <span>${hora}</span>
                <span style="font-size:0.75rem; color:${disponibles === 0 ? 'var(--danger)' : 'var(--text-muted)'}">${disponibles} de ${CAMAS_MAX} Libres</span>
              </div>
              ${htmlOcupantes}
              ${(modoVista === 'alumno' && disponibles > 0) ? `<button class="btn btn-primary" style="width:100%; font-size:0.75rem; padding:0.3rem;" onclick="agendarTurno('${fechaIso}', '${hora}')">+ Agendar</button>` : ''}
            `;
            col.appendChild(card);
          });
        }

        grid.appendChild(col);
      }
    }

    // CONTROL DE NAVEGACIÓN DE FECHAS
    function getLunes(d) {
      const date = new Date(d);
      const day = date.getDay();
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(date.setDate(diff));
    }

    function navegarSemana(offset) {
      if (offset === 0) {
        fechaReferencia = new Date();
      } else {
        fechaReferencia.setDate(fechaReferencia.getDate() + (offset * 7));
      }
      renderGrid();
    }

    // VISTAS Y ROLES
    function cambiarVista() {
      modoVista = document.getElementById('select-vista').value;
      document.getElementById('seccion-admin').style.display = modoVista === 'admin' ? 'block' : 'none';
      document.getElementById('seccion-alumno-login').style.display = modoVista === 'alumno' ? 'block' : 'none';
      
      if (modoVista === 'alumno') {
        actualizarVistaAlumno();
      } else {
        alumnoActivoId = null;
      }
      renderGrid();
    }

    function poblarSelectAlumnos() {
      const select = document.getElementById('select-alumno-activo');
      select.innerHTML = '<option value="">-- Seleccionar --</option>';
      dbAlumnos.forEach(a => {
        select.innerHTML += `<option value="${a.id}">${a.nombre}</option>`;
      });
    }

    function actualizarVistaAlumno() {
      const val = document.getElementById('select-alumno-activo').value;
      alumnoActivoId = val ? parseInt(val) : null;

      const info = document.getElementById('creditos-info');
      if (alumnoActivoId) {
        const al = dbAlumnos.find(a => a.id === alumnoActivoId);
        info.innerText = `Créditos de recupero disponibles: ${al ? al.clases_a_recuperar || 0 : 0}`;
      } else {
        info.innerText = '';
      }
      renderGrid();
    }

    // FORMULARIO ALTA
    function abrirModalAltaAlumno() {
      document.getElementById('modal-alta').style.display = 'flex';
      actualizarMontoCuota();
    }

    function cerrarModalAlta() {
      document.getElementById('modal-alta').style.display = 'none';
    }

    function actualizarMontoCuota() {
      const freq = document.getElementById('alta-frecuencia').value;
      document.getElementById('alta-cuota').value = `$${TARIFAS_DEFAULT[freq].toLocaleString()}`;
    }

    async function guardarAlumno(e) {
      e.preventDefault();
      const nombre = document.getElementById('alta-nombre').value;
      const freq = parseInt(document.getElementById('alta-frecuencia').value);

      const nuevo = {
        nombre: nombre,
        frecuencia_semanal: freq,
        monto_cuota: TARIFAS_DEFAULT[freq],
        clases_a_recuperar: 0
      };

      const { data } = await supabase.from('alumnos').insert([nuevo]).select();
      if (data) {
        dbAlumnos.push(data[0]);
        poblarSelectAlumnos();
        renderListaAlumnos();
        cerrarModalAlta();
      }
    }
  </script>
</body>
</html>
